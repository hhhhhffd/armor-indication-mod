# Keeps Gradle memory usage modest while still being enough for a small Fabric client mod.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric and Minecraft versions verified against 1.21.4-era artifacts.
minecraft_version=1.21.4
yarn_mappings=1.21.4+build.8
loader_version=0.16.10
loom_version=1.9.2
fabric_api_version=0.119.4+1.21.4

# Project coordinates.
mod_version=1.0.0
maven_group=armorindication
archives_base_name=armor-indication
